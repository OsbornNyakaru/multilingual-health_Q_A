# Shared configuration. All other configs compose on top of this.

project: afro-health-qa
seed: 42

# Four target languages (ISO-639-3).
languages:
  - lug  # Luganda
  - swa  # Kiswahili
  - aka  # Akan / Twi
  - amh  # Amharic

# Paths are relative to repo root.
paths:
  data_raw: data/raw
  data_processed: data/processed
  data_augmented: data/augmented
  data_external: data/external
  models: models
  submissions: submissions
  experiments: experiments
  hf_cache: .cache/huggingface

# Expected Zindi file names — adjust once files drop.
files:
  train: data/raw/Train.csv
  test: data/raw/Test.csv
  sample_submission: data/raw/SampleSubmission.csv

# Expected columns (per Zindi boilerplate; adapt on data drop).
columns:
  id: ID
  question: Question
  language: Language
  response: Response
  submission_targets:
    - TargetBert
    - TargetRLF1
    - TargetR1F1
    - TargetLLM

# Weighted scoring (must match Zindi's leaderboard; vault/facts/F-001-competition-metric.md).
# Fixed 2026-09-24: the old 0.25/0.25/0.30/0.20 split was a pre-release guess.
# AfroLM BertScore is a host-side secondary check, not on the leaderboard (weight 0).
# Nothing reads these keys yet; code uses afro_health_qa.evaluation.combined.W_*.
scoring_weights:
  rouge1: 0.37
  rouge_l: 0.37
  afrolm_bertscore: 0.0
  llm_judge: 0.26

# ROUGE tokenizer: whitespace = official starter notebook (str.split, case-sensitive, no stemmer).
rouge_tokenizer: whitespace

# W&B defaults — override via env.
wandb:
  project: afro-health-qa
  entity: chiromo-forge
  mode: online   # offline if no network
