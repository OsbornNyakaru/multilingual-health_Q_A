# Beam search, num_beams=5. Diminishing returns beyond this (see KNOWN_ISSUES).

strategy: beam
do_sample: false
num_beams: 5
num_beam_groups: 1
length_policy: per_language_quantiles
length_quantile_low: 0.25
length_quantile_high: 0.95
length_penalty: 1.0
early_stopping: true
repetition_penalty: 1.1
no_repeat_ngram_size: 3
