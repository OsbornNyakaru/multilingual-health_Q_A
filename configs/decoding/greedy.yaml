# Cheapest, deterministic decoding. Baseline submission uses this.

strategy: greedy
do_sample: false
num_beams: 1
# Per-language min/max length set at runtime from training answer distribution.
length_policy: per_language_quantiles
length_quantile_low: 0.25
length_quantile_high: 0.95
repetition_penalty: 1.1
no_repeat_ngram_size: 3
