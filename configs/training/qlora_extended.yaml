# 4-epoch variant. Use only when default regime is clearly under-fit (train loss still falling at end of epoch 3).

model_config: configs/models/aya_expanse_8b.yaml
data_config: configs/data.yaml

output_dir: models/qlora_extended
run_name: qlora_extended

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM

training:
  num_train_epochs: 4
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 0.3
  optim: paged_adamw_8bit
  bf16: true
  fp16: false
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 200
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  report_to: wandb
  seed: 42
  dataloader_num_workers: 2
  remove_unused_columns: false

sequence:
  max_length: 1024
  padding: longest
  truncation: true

early_stopping:
  patience: 4
  threshold: 0.001
